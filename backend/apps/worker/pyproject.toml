[project]
name = "driftless-worker"
version = "0.1.0"
description = "Temporal worker running migration workflows and activities"
requires-python = ">=3.14"
dependencies = [
  "driftless-core",
  "driftless-connectors",
  "driftless-engine",
  "temporalio>=1.8",
]

[project.scripts]
driftless-worker = "driftless_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftless_worker"]
