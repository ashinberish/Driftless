[project]
name = "driftless-cli"
version = "0.1.0"
description = "Driftless command-line interface (`dbm`)"
requires-python = ">=3.14"
dependencies = [
  "driftless-core",
  "driftless-connectors",
  "driftless-engine",
  "typer>=0.15",
  "rich>=13.9",
]

[project.scripts]
dbm = "driftless_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftless_cli"]
