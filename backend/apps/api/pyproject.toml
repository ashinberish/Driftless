[project]
name = "driftless-api"
version = "0.1.0"
description = "Driftless control-plane REST API"
requires-python = ">=3.14"
dependencies = [
  "driftless-core",
  "driftless-connectors",
  "driftless-engine",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
driftless-api = "driftless_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftless_api"]
