[project]
name = "driftless-core"
version = "0.1.0"
description = "Engine-neutral domain model: canonical schema/types, value normalization, config, errors"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftless_core"]
