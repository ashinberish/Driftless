[project]
name = "driftless-engine"
version = "0.1.0"
description = "Migration engine: assess, convert, copy planning and validation"
requires-python = ">=3.14"
dependencies = [
  "driftless-core",
  "driftless-connectors",
  "sqlglot>=26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftless_engine"]
