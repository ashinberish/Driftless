name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest --cov --cov-report=xml -m "not integration"

  backend-integration:
    name: Backend integration (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DRIFTLESS_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Start PostgreSQL with logical replication
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            postgres:17 -c wal_level=logical
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -m integration

  api-contract:
    name: API contract (OpenAPI ↔ frontend types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd backend && uv sync --frozen
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: make api-types
      - name: Fail if generated types are stale
        run: |
          git diff --exit-code -- frontend/packages/api-client || {
            echo "::error::API types are out of date. Run 'make api-types' and commit the result."
            exit 1
          }

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, backend-integration, frontend]
    strategy:
      matrix:
        include:
          - { name: api, file: deploy/docker/backend.Dockerfile, app: api }
          - { name: worker, file: deploy/docker/backend.Dockerfile, app: worker }
          - { name: web, file: deploy/docker/web.Dockerfile, app: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: APP=${{ matrix.app }}
          push: false
          tags: driftless-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose-smoke:
    name: Full stack (make up)
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v7
      - name: Start everything
        run: make up
      - name: Wait for the web app and API (through nginx)
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/ >/dev/null && \
            curl -sf http://localhost:8080/api/v1/connectors | grep -q postgres && exit 0
            sleep 2
          done
          echo "::error::stack did not become healthy"; exit 1
      - name: Assess the seeded sample database end to end
        run: |
          set -e
          API=http://localhost:8080/api/v1
          conn=$(curl -sf -X POST $API/connections -H 'content-type: application/json' \
            -d '{"name":"shop","engine":"postgres","host":"pg-source","port":5432,"database":"shop","username":"source","secret_ref":"env:SAMPLE_SOURCE_PW","ssl_mode":"disable"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          mig=$(curl -sf -X POST $API/migrations -H 'content-type: application/json' \
            -d "{\"name\":\"smoke\",\"source_connection_id\":\"$conn\",\"target_engine\":\"postgres\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -sf -X POST $API/migrations/$mig/assessments | python3 -c \
            'import json,sys; a=json.load(sys.stdin)["assessment"]; assert a["tables"]==4, a; print("tables:", a["tables"], "ready:", a["ready"])'
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml --profile app ps
          docker compose -f deploy/docker-compose.yml --profile app logs --no-color
      - if: always()
        run: make down

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/driftless && helm template ci deploy/helm/driftless > /dev/null
